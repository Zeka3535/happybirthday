<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка адаптивности · 320 / 360 / 390</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #111;
            color: #eee;

<body>

    <div class="row">
        <div class="phone">
            <p>320 × 568 (iPhone SE)</p>
            <iframe src="../index.html?demo=1" width="320" height="568"></iframe>
        </div>
        <div class="phone">
            <p>360 × 640 (бюджетный Android)</p>
            <iframe src="../index.html?demo=1" width="360" height="640"></iframe>
        </div>
        <div class="phone">
            <p>390 × 844 (iPhone 14)</p>
            <iframe src="../index.html?demo=1" width="390" height="844"></iframe>
        </div>
    </div>

</html>
